name: Deploy

# Runs the full test suite on main. The Oracle server polls for a successful run
# of this workflow and installs the same commit itself, so no server credential
# is stored in GitHub. Vercel deploys the dashboard through its Git integration.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
