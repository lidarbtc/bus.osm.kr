<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서울·경기 버스 OSM 동기화</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header>
  <h1>서울·경기 버스 OSM 동기화</h1>
  <div id="account" aria-live="polite"></div>
</header>
<main>
  <section id="status" class="banner" aria-live="polite">상태를 불러오는 중…</section>
  <section id="actions"></section>
  <section>
    <h2>비교 실행</h2>
    <p class="note">보고서는 브라우저에서 바로 보고, 원본 결과는 gzip 압축 파일로 내려받습니다.</p>
    <div id="runs"></div>
  </section>
  <section>
    <h2>봇 변경세트</h2>
    <p class="note">이 시스템의 봇 계정이 OSM에 올린 변경세트만 표시합니다. 롤백을 요청하면 자동 작업이 함께 정지됩니다.</p>
    <div id="changesets"></div>
  </section>
  <section>
    <h2>롤백 요청</h2>
    <div id="jobs"></div>
  </section>
  <section>
    <h2>감사 기록</h2>
    <div id="audit"></div>
  </section>
</main>
<footer>지도 데이터 © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a> · 서울 공공누리 1유형 · 경기도 버스정보 · <a href="https://github.com/lidarbtc/osm-korea-bus-sync">소스 코드</a></footer>
</body>
</html>
