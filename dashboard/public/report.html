<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비교 보고서 · 서울·경기 버스 OSM 동기화</title>
<meta name="description" content="서울·경기 버스 정류소와 노선의 공공데이터·OpenStreetMap 대응 현황">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141c22" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="bus.osm.kr">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="비교 보고서 · 서울·경기 버스 OSM 동기화">
<meta property="og:description" content="서울·경기 버스 정류소와 노선의 공공데이터·OpenStreetMap 대응 현황">
<meta property="og:url" content="https://bus.osm.kr/report.html">
<meta property="og:image" content="https://bus.osm.kr/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="서울·경기 버스 OSM 동기화">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/app.css">
<script src="/report.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/"><img src="/favicon.svg" alt="" width="28" height="28"><span>서울·경기 버스<span class="brand-long"> OSM 동기화</span></span></a>
  </div>
</header>
<main class="wrap">
  <div class="page-head">
    <h1>비교 보고서</h1>
    <p id="meta" class="meta" aria-live="polite">불러오는 중…</p>
  </div>
  <div class="card toolbar" role="search">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
      <input id="search" class="input" type="search" placeholder="이름, 번호, OSM ID" aria-label="검색" autocomplete="off" disabled>
    </label>
    <select id="kind" class="select" aria-label="종류" disabled>
      <option value="">모든 종류</option><option value="stop">정류소</option><option value="route">노선</option><option value="route_master">노선 그룹</option>
    </select>
    <select id="side" class="select" aria-label="출처" disabled>
      <option value="">모든 출처</option><option value="source">공식 (서울·경기)</option><option value="seoul">서울</option><option value="gbis">경기</option><option value="osm">OSM</option>
    </select>
    <select id="status" class="select" aria-label="상태" disabled><option value="">모든 상태</option></select>
    <label class="check"><input id="support" type="checkbox" disabled> 경계 밖 포함</label>
  </div>
  <div class="card map-card">
    <canvas id="map" role="img" aria-label="정류소 위치"></canvas>
    <div class="legend"><span><i class="official"></i>공식</span><span><i class="osm"></i>OSM</span><span><i class="exception"></i>예외</span></div>
  </div>
  <div class="results-head">
    <p id="count" class="count"></p>
    <div class="pager" data-pager></div>
  </div>
  <div class="card table-card">
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>이름</th><th>구분</th><th>객체</th><th>상태</th><th>대응</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <p id="no-results" class="empty" hidden>조건에 맞는 항목이 없습니다.</p>
  </div>
  <div class="pager pager-bottom" data-pager></div>
</main>
<footer class="wrap footer">
  <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>
  <a href="https://data.seoul.go.kr">서울특별시</a>
  <a href="https://www.gbis.go.kr">경기도</a>
  <a href="https://github.com/lidarbtc/bus.osm.kr">GitHub</a>
</footer>
</body>
</html>
